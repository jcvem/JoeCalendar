name: JoeCalendar
options:
  bundleIdPrefix: com.vemstudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
targets:
  JoeCalendar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JoeCalendar
    settings:
      base:
        PRODUCT_NAME: JoeCalendar
        PRODUCT_BUNDLE_IDENTIFIER: com.vemstudio.joecalendar
        INFOPLIST_FILE: JoeCalendar/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
